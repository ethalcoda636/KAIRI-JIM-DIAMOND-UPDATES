name: Publish KAIRI JIM DIAMOND v0.11.3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-verify:
    if: github.head_ref == 'publish-diamond-v0.11.3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: '0.11.3'
      ASSET_NAME: 'KAIRI-JIM-DIAMOND-v0.11.3-Setup.exe'
      EXPECTED_SHA: '469b187f6796c706551cd6ab75dc1f157b4a1e35bd258f65d46ac2ee9ff9b292'
      ARTIFACT_URL: 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-02fc-8206-98a8-32992f37af28/raw?se=2026-08-03T16:01:23Z&sp=r&sv=2026-02-06&sr=b&scid=3272d145-1b2a-5ce0-9e59-ebb3689afd54&skoid=0556a536-9b18-4aa8-bae0-70ed682ee936&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-03T10:53:23Z&ske=2026-08-04T10:53:23Z&sks=b&skv=2026-02-06&sig=currCfC3obh1PPTbNwlabPfCgpzT/3R7nzMXlS2yZiI%3D'
    steps:
      - name: Check out public updater repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download verified private build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output artifact.zip
          unzip -q artifact.zip -d release-files
          test -f "release-files/$ASSET_NAME"
          actual="$(sha256sum "release-files/$ASSET_NAME" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA"
          cp "release-files/$ASSET_NAME.sha256.txt" release-files/diamond.sha256.txt

      - name: Write signed public manifest
        shell: bash
        run: |
          cat > manifest.json <<'JSON'
          {
            "version": "0.11.3",
            "installerUrl": "https://github.com/ethalcoda636/KAIRI-JIM-DIAMOND-UPDATES/releases/download/v0.11.3/KAIRI-JIM-DIAMOND-v0.11.3-Setup.exe",
            "sha256": "469b187f6796c706551cd6ab75dc1f157b4a1e35bd258f65d46ac2ee9ff9b292",
            "signature": "OPKNIZKWvhQjdDdH/xcn5WEkG/3UNrl+phn/Eq7LROg4p1vULNLSe7et1eDDLay6D6ADd7+FtzXPLd24OCrKAw=="
          }
          JSON

      - name: Publish release installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "release-files/$ASSET_NAME" "release-files/$ASSET_NAME.sha256.txt" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "release-files/$ASSET_NAME" "release-files/$ASSET_NAME.sha256.txt" --title "KAIRI JIM DIAMOND $tag" --notes "Verified silent auto-update bridge for existing customers." --repo "$GITHUB_REPOSITORY"
          fi

      - name: Commit signed manifest to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish KAIRI JIM DIAMOND v0.11.3 manifest'
            git push origin main
          fi

      - name: Verify public release and manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "https://github.com/ethalcoda636/KAIRI-JIM-DIAMOND-UPDATES/releases/download/v0.11.3/$ASSET_NAME" --output published.exe
          test "$(sha256sum published.exe | awk '{print $1}')" = "$EXPECTED_SHA"
          node -e "const m=require('./manifest.json'); if(m.version!=='0.11.3'||m.sha256!==process.env.EXPECTED_SHA||!m.signature) process.exit(1)"
