name: Verify KAIRI JIM DIAMOND v0.11.2 Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.11.2.yml"

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout update repository
        uses: actions/checkout@v4

      - name: Wait for verified release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..24}; do
            asset="$(gh release view v0.11.2 --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if echo "$asset" | grep -Fxq "KAIRI-JIM-DIAMOND-v0.11.2-Setup.exe"; then
              echo "Verified release asset found."
              exit 0
            fi
            echo "Waiting for release asset... attempt $attempt/24"
            sleep 15
          done
          echo "Release asset was not found."
          exit 1

      - name: Write success marker
        shell: bash
        run: |
          cat > release-status.json <<'JSON'
          {
            "version": "0.11.2",
            "tag": "v0.11.2",
            "asset": "KAIRI-JIM-DIAMOND-v0.11.2-Setup.exe",
            "sha256": "138f21072493828e4981be390d2822c8f4313ce28b3fbe555e04a5bc2ab64513",
            "status": "verified"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-status.json
          git commit -m "Verify public v0.11.2 release asset" || true
          git push
